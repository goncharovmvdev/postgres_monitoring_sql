apiVersion: 1

# старые роль-именованные датасорсы (identity model: имя = НОДА, не роль)
deleteDatasources:
  - name: PostgreSQL primary
    orgId: 1
  - name: PostgreSQL standby
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # прямые SQL-датасорсы для «живых» панелей pg-layered (блокировочная топология,
  # таблица ключевых настроек): такое нельзя/незачем класть в метрики — читается
  # из PG при просмотре. Роль monitoring уже защищена таймаутами
  # (statement_timeout 5s / lock_timeout 1s).
  # ВАЖНО: uid обязан быть "pg-<node>" (pg-pg01/pg-pg02, имена нод из
  # sql_exporter.yml) — панели «Blocking Sessions» и «Instance Settings»
  # ссылаются на датасорс как uid: pg-${node}, отдельного переключателя нет.
  # Именование по НОДЕ, а не по роли: после failover DSN не меняется, панель
  # продолжает смотреть на ту же ноду, которую выбрали в переменной «Нода»
  - name: PostgreSQL pg01
    type: postgres
    uid: pg-pg01
    access: proxy
    url: postgres:5432
    user: monitoring
    jsonData:
      database: postgres
      sslmode: disable
      postgresVersion: 1500   # максимум, известный Grafana 11; влияет только на подсказки
    secureJsonData:
      password: monitoring

  - name: PostgreSQL pg02
    type: postgres
    uid: pg-pg02
    access: proxy
    url: replica:5432
    user: monitoring
    jsonData:
      database: postgres
      sslmode: disable
      postgresVersion: 1500
    secureJsonData:
      password: monitoring
