listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB          # без явного значения откатится на вшитые 8MB
dynamic_shared_memory_type = posix

hba_file = '/etc/postgresql/pg_hba.conf'

hot_standby = on

shared_preload_libraries = 'pg_stat_statements,pg_wait_sampling,pg_stat_kcache,auto_explain,pg_cron'
cron.database_name = 'postgres'
cron.use_background_workers = on
track_io_timing = on
track_wal_io_timing = on

# queryid в каждой строке лога связывает записи auto_explain /
# log_lock_waits с метриками pg_stat_statements и plan-flip детектором
log_line_prefix = '%m [%p] %q%u@%d app=%a qid=%Q '

auto_explain.log_min_duration = '250ms' #сделать побольше?
auto_explain.sample_rate = 0.1 # сделать побольше?
auto_explain.log_analyze = on # вроде не тяжело
auto_explain.log_timing = off # честно я хз почему это дорого
auto_explain.log_format = json
auto_explain.log_verbose = on

# (rate(count)/100 = среднее число сессий в этом состоянии, AAS)
pg_wait_sampling.profile_period = 10
pg_wait_sampling.profile_queries = on

log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0 # побольше поставить? логирует каждый автовакум

archive_mode = on
archive_command = 'mkdir -p /tmp/wal_archive && test ! -f /tmp/wal_archive/%f && cp %p /tmp/wal_archive/%f'
