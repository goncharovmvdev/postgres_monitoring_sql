# Статичный конфиг primary (подключается единственным флагом -c config_file=... в compose).
# Файл ПОЛНОСТЬЮ заменяет сгенерированный initdb: поэтому здесь есть и базовые
# параметры, которые обычно проставляет initdb/entrypoint.

# --- база: без listen_addresses='*' к контейнеру никто не подключится
listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB          # без явного значения откатится на вшитые 8MB
dynamic_shared_memory_type = posix

# --- статичный pg_hba из этого же каталога
hba_file = '/etc/postgresql/pg_hba.conf'

# --- мониторинг (pg_cron — регламентные сбросы статистики, init/07_maintenance_cron.sql)
shared_preload_libraries = 'pg_stat_statements,pg_wait_sampling,pg_stat_kcache,auto_explain,pg_cron'
cron.database_name = 'postgres'
# джобы в background workers, а не через libpq к localhost:
# не зависят от pg_hba/паролей и не занимают клиентские коннекты
cron.use_background_workers = on
track_io_timing = on
# латентность write/fsync WAL в мс (панель «WAL: латентность»; главный драйвер
# commit latency при sync-репликации); overhead как у track_io_timing — доли %
track_wal_io_timing = on

# queryid в каждой строке лога (%Q, PG14+): связывает записи auto_explain /
# log_lock_waits с метриками pg_stat_statements и plan-flip детектором
log_line_prefix = '%m [%p] %q%u@%d app=%a qid=%Q '

# CPU и реальный дисковый IO per query (fixes.txt HIGH: pg_stat_kcache);
# overhead: getrusage на запрос, ~1%

# планы медленных запросов в лог (fixes.txt CRITICAL: захват планов);
# log_timing=off — ключ к безопасности: сам EXPLAIN ANALYZE без таймингов дёшев
auto_explain.log_min_duration = '250ms'
auto_explain.sample_rate = 0.1
auto_explain.log_analyze = on
auto_explain.log_timing = off
auto_explain.log_format = json
# печатает Query Identifier внутри плана (PG16+) — поиск плана по queryid в логах
auto_explain.log_verbose = on

# continuous profiling нагрузки: сэмплер wait events каждые 10 мс с привязкой к queryid
# (rate(count)/100 = среднее число сессий в этом состоянии, AAS)
pg_wait_sampling.profile_period = 10
pg_wait_sampling.profile_queries = on

# --- следы проблем в логах (docker logs example-postgres-1)
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# --- архивация WAL в каталог внутри контейнера (панель архиватора);
#     в проде здесь pgbackrest/wal-g, а не cp
archive_mode = on
archive_command = 'mkdir -p /tmp/wal_archive && test ! -f /tmp/wal_archive/%f && cp %p /tmp/wal_archive/%f'

# synchronous_standby_names НЕ здесь, а в init/05_sync_replication.sql (ALTER SYSTEM):
# этот файл читает и временный сервер init-фазы entrypoint, который с sync-настройкой
# намертво зависает на CREATE DATABASE в ожидании ещё не существующей реплики
