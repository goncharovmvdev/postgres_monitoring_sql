# Статичный pg_hba primary (подключается через -c hba_file=... в compose).
# ВАЖНО: локальные trust-строки обязательны — ими пользуется init-фаза
# docker-entrypoint (временный сервер на unix-сокете).

# TYPE  DATABASE     USER        ADDRESS        METHOD
local   all          all                        trust
host    all          all         127.0.0.1/32   trust
host    all          all         ::1/128        trust

# клиенты из docker-сети (load, экспортёры)
host    all          all         all            scram-sha-256

# стриминг-репликация изнутри docker-сети; trust только для демо,
# в проде — scram + пароль в primary_conninfo/.pgpass
host    replication  replicator  all            trust
