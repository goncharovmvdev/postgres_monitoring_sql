# слой "postgres: базы и объекты", state-часть (60s): дешёвые вью, но
# сортировка per-table метрик по pg_total_relation_size — не для 15s.
# Размеры/индексная гигиена/sequences — в pg_objects_slow.yml (300s),
# bloat — в pg_bloat.yml (1h). per-table ограничено объединением top-10 по
# четырём осям (<= 40 таблиц) — защита от взрыва кардинальности в проде.
# У per-table метрик ОБЯЗАТЕЛЬНЫ datname+schemaname: без схемы одинаковый
# relname в двух схемах даёт дубль лейблов — клиент отвергает всю метрику.
# ВНИМАНИЕ: pg_stat_user_tables видит только ПОДКЛЮЧЁННУЮ базу (datname);
# поэтому объектные коллекторы идут отдельными job'ами по базе (pgNN-appdb
# в sql_exporter.yml, DSN в прикладную appdb) — по target'у на каждую базу
collector_name: pg_objects
min_interval: 60s

# Общие запросы (query_ref): каждый отвечает на ОДИН вопрос
queries:
  # «какова дистанция до wraparound по базам» — XID и MXID: два счётчика одной угрозы
  - query_name: q_wraparound
    query: |
      SELECT
        datname,
        age(datfrozenxid)::float8    AS xid_age,
        mxid_age(datminmxid)::float8 AS mxid_age
      FROM pg_database

  # ТОП ПО НЕСКОЛЬКИМ ОСЯМ, а не только по размеру: маленькая, но горячая или
  # распухшая таблица в top-по-размеру не попадает и остаётся невидимой.
  # Берём объединение четырёх top-10: размер, мёртвые строки, запись
  # (ins+upd+del) и объём seq-чтения. Уникальных таблиц <= 40 (обычно меньше:
  # списки пересекаются) — это и потолок кардинальности per-table метрик.
  # Один pg_total_relation_size на выборку вместо трёх сортировок, состав
  # top-набора у всех трёх метрик гарантированно единый
  - query_name: q_top_tables
    query: |
      WITH ranked AS (
        (SELECT relid FROM pg_stat_user_tables ORDER BY pg_total_relation_size(relid) DESC NULLS LAST LIMIT 10)
        UNION
        (SELECT relid FROM pg_stat_user_tables ORDER BY n_dead_tup DESC NULLS LAST LIMIT 10)
        UNION
        (SELECT relid FROM pg_stat_user_tables ORDER BY (n_tup_ins + n_tup_upd + n_tup_del) DESC NULLS LAST LIMIT 10)
        UNION
        (SELECT relid FROM pg_stat_user_tables ORDER BY seq_tup_read DESC NULLS LAST LIMIT 10)
      )
      SELECT
        current_database()              AS datname,
        s.schemaname,
        s.relname,
        s.seq_scan::float8              AS seq_scan,
        s.seq_tup_read::float8          AS seq_tup_read,
        COALESCE(s.idx_scan, 0)::float8 AS idx_scan,
        s.n_tup_ins::float8             AS tup_ins,
        s.n_tup_upd::float8             AS tup_upd,
        s.n_tup_del::float8             AS tup_del,
        s.n_tup_hot_upd::float8         AS tup_hot_upd,
        s.n_live_tup::float8            AS live,
        s.n_dead_tup::float8            AS dead,
        COALESCE(EXTRACT(EPOCH FROM (now() - GREATEST(s.last_vacuum, s.last_autovacuum))), -1)::float8   AS vacuum,
        COALESCE(EXTRACT(EPOCH FROM (now() - GREATEST(s.last_analyze, s.last_autoanalyze))), -1)::float8 AS analyze
      FROM pg_stat_user_tables s
      JOIN ranked r ON r.relid = s.relid

  # ДОЛГ ВАКУУМА с учётом per-table reloptions и insert-триггера: глобальные
  # autovacuum_vacuum_* — лишь дефолт, таблица может переопределить их через
  # ALTER TABLE ... SET (autovacuum_*), а с PG13 вакуум запускается ещё и по
  # НАКОПЛЕННЫМ ВСТАВКАМ (n_ins_since_vacuum) — append-only таблицы старая
  # формула не видела вовсе. Разбивка по reason: dead / inserts — ждут вакуума,
  # disabled — autovacuum_enabled=false, их не вакуумит НИКТО (тихий долг).
  # ithr < 0 = insert-триггер выключен (autovacuum_vacuum_insert_threshold=-1)
  - query_name: q_tables_need_vacuum
    query: |
      SELECT
        current_database() AS datname,
        COUNT(*) FILTER (
          WHERE o.av_on AND s.n_dead_tup > o.thr + o.sf * GREATEST(c.reltuples, 0)
        )::float8 AS dead,
        COUNT(*) FILTER (
          WHERE o.av_on AND o.ithr >= 0
            AND s.n_ins_since_vacuum > o.ithr + o.isf * GREATEST(c.reltuples, 0)
        )::float8 AS inserts,
        COUNT(*) FILTER (WHERE NOT o.av_on)::float8 AS disabled
      FROM pg_stat_user_tables s
      JOIN pg_class c ON c.oid = s.relid
      CROSS JOIN LATERAL (
        SELECT
          COALESCE((SELECT option_value FROM pg_options_to_table(c.reloptions)
                    WHERE option_name = 'autovacuum_vacuum_threshold')::numeric,
                   current_setting('autovacuum_vacuum_threshold')::numeric) AS thr,
          COALESCE((SELECT option_value FROM pg_options_to_table(c.reloptions)
                    WHERE option_name = 'autovacuum_vacuum_scale_factor')::numeric,
                   current_setting('autovacuum_vacuum_scale_factor')::numeric) AS sf,
          COALESCE((SELECT option_value FROM pg_options_to_table(c.reloptions)
                    WHERE option_name = 'autovacuum_vacuum_insert_threshold')::numeric,
                   current_setting('autovacuum_vacuum_insert_threshold')::numeric) AS ithr,
          COALESCE((SELECT option_value FROM pg_options_to_table(c.reloptions)
                    WHERE option_name = 'autovacuum_vacuum_insert_scale_factor')::numeric,
                   current_setting('autovacuum_vacuum_insert_scale_factor')::numeric) AS isf,
          COALESCE((SELECT option_value FROM pg_options_to_table(c.reloptions)
                    WHERE option_name = 'autovacuum_enabled'), 'true')::boolean AS av_on
      ) o

  # вью КЛАСТЕРНАЯ (строки вакуумов всех баз), а relid резолвится только в
  # локальном каталоге — чужие базы помечаются '(remote-db)' вместо ложного
  # имени; MAX/GROUP BY гасит дубли схлопнувшихся строк
  - query_name: q_vacuum_progress
    query: |
      SELECT
        p.datname,
        CASE
          WHEN p.datname = current_database() THEN COALESCE(n.nspname, '(unknown)')
          ELSE '(remote-db)'
        END AS schemaname,
        CASE
          WHEN p.datname = current_database() THEN COALESCE(c.relname, '(unknown)')
          ELSE '(remote-db)'
        END AS relname,
        p.phase,
        MAX(COALESCE(100.0 * p.heap_blks_scanned / NULLIF(p.heap_blks_total, 0), 0))::float8 AS pct
      FROM pg_stat_progress_vacuum p
      LEFT JOIN pg_class c ON c.oid = p.relid AND p.datname = current_database()
      LEFT JOIN pg_namespace n ON n.oid = c.relnamespace
      GROUP BY 1, 2, 3, 4
      UNION ALL
      SELECT current_database(), '(idle)', '(idle)', 'none', 0::float8
      WHERE NOT EXISTS (SELECT 1 FROM pg_stat_progress_vacuum)

metrics:
  - metric_name: pg_db_xid_age
    type: gauge
    help: "XID age per database, wraparound risk (vacuum/xid_wraparound_databases.sql)"
    key_labels: [datname]
    values: [xid_age]
    query_ref: q_wraparound

  - metric_name: pg_db_mxid_age
    type: gauge
    help: "Multixact age per database (vacuum/xid_wraparound_databases.sql)"
    key_labels: [datname]
    values: [mxid_age]
    query_ref: q_wraparound

  # --- per-table: активность и HOT (tables/seq_scan_heavy_tables.sql, tables/hot_update_ratio.sql) ---
  - metric_name: pg_table_activity_total
    type: counter
    help: "Per-table access/write counters: seq vs idx scans = index candidates (tables/seq_scan_heavy_tables.sql), hot_upd vs upd = HOT ratio (tables/hot_update_ratio.sql)"
    key_labels: [datname, schemaname, relname]
    value_label: op
    values: [seq_scan, seq_tup_read, idx_scan, tup_ins, tup_upd, tup_del, tup_hot_upd]
    query_ref: q_top_tables

  # --- per-table: живые/мёртвые строки (tables/dead_tuples.sql) ---
  - metric_name: pg_table_tuples
    type: gauge
    help: "Live/dead tuples per table (tables/dead_tuples.sql)"
    key_labels: [datname, schemaname, relname]
    value_label: kind
    values: [live, dead]
    query_ref: q_top_tables

  # --- per-table: давность вакуума/анализа (vacuum/last_vacuum_analyze.sql); -1 = никогда ---
  - metric_name: pg_table_maintenance_age_seconds
    type: gauge
    help: "Seconds since last (auto)vacuum / (auto)analyze; -1 = never (vacuum/last_vacuum_analyze.sql)"
    key_labels: [datname, schemaname, relname]
    value_label: kind
    values: [vacuum, analyze]
    query_ref: q_top_tables

  # --- сколько таблиц ждут автовакуума (vacuum/tables_need_vacuum.sql, глобальные пороги) ---
  - metric_name: pg_tables_need_vacuum
    type: gauge
    help: "Tables awaiting autovacuum by reason: dead tuples / accumulated inserts (PG13+) / autovacuum disabled; per-table reloptions honoured"
    key_labels: [datname]
    value_label: reason
    values: [dead, inserts, disabled]
    query_ref: q_tables_need_vacuum

  # --- прогресс работающих vacuum (vacuum/vacuum_progress.sql, fixes.txt MEDIUM):
  #     "вакуум по таблице X идёт 6 часов" видно только отсюда ---
  - metric_name: pg_vacuum_progress_pct
    type: gauge
    help: "Running (auto)vacuum progress percent by db/table/phase (pg_stat_progress_vacuum)"
    key_labels: [datname, schemaname, relname, phase]
    values: [pct]
    query_ref: q_vacuum_progress
