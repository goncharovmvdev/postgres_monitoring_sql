# имена базовых метрик совместимы с postgres_exporter, чтобы дашборды/алерты не менять
# ВНИМАНИЕ: pg_stat_checkpointer/pg_stat_io — PG17/PG16+; на PG<=16 см. wal/checkpoints.sql
collector_name: pg_instance

queries:
  - query_name: q_up_uptime
    query: |
      SELECT
        1::float8 AS up,
        EXTRACT(
          EPOCH FROM (
            now() - pg_postmaster_start_time()
          )
        )::float8 AS uptime_seconds

  - query_name: q_activity_by_state
    query: |
      SELECT
        COALESCE(state, 'background') AS state,
        COUNT(*)::float8              AS cnt
      FROM pg_stat_activity
      GROUP BY 1

  - query_name: q_activity_scalars
    query: |
      SELECT
        COUNT(*) FILTER (
          WHERE backend_type = 'client backend'
        )::float8 AS client_backends,
        COUNT(*) FILTER (
          WHERE TRUE
            AND backend_type = 'client backend'
            AND xact_start < now() - INTERVAL '10 seconds'
        )::float8 AS long_running
      FROM pg_stat_activity

  - query_name: q_backends_by_user
    query: |
      SELECT
        COALESCE(datname, '(none)') AS datname,
        COALESCE(usename, '(none)') AS usename,
        COUNT(*)::float8            AS cnt
      FROM pg_stat_activity
      WHERE backend_type = 'client backend'
      GROUP BY 1, 2
      ORDER BY COUNT(*) DESC
      LIMIT 20

  - query_name: q_settings
    query: |
      SELECT
        current_setting('max_connections')::float8        AS max_connections,
        current_setting('autovacuum_max_workers')::float8 AS autovacuum_max_workers,
        (
          SELECT
            COUNT(*)
          FROM pg_settings
          WHERE pending_restart
        )::float8                                         AS pending_restart

  - query_name: q_stat_database
    query: |
      SELECT
        d.datname,
        s.xact_commit::float8        AS xact_commit,
        s.xact_rollback::float8      AS xact_rollback,
        s.blks_hit::float8           AS blks_hit,
        s.blks_read::float8          AS blks_read,
        s.deadlocks::float8          AS deadlocks,
        s.temp_bytes::float8         AS bytes,
        s.temp_files::float8         AS files,
        s.blk_read_time::float8      AS read,
        s.blk_write_time::float8     AS write,
        s.tup_returned::float8       AS returned,
        s.tup_fetched::float8        AS fetched,
        s.tup_inserted::float8       AS inserted,
        s.tup_updated::float8        AS updated,
        s.tup_deleted::float8        AS deleted,
        s.sessions::float8           AS total,
        s.sessions_abandoned::float8 AS abandoned,
        s.sessions_fatal::float8     AS fatal,
        s.sessions_killed::float8    AS killed
      FROM pg_stat_database s
      JOIN pg_database d ON d.oid = s.datid
      WHERE NOT d.datistemplate

  # НЕ сливать в q_stat_database: сумма нарочно без JOIN/фильтра — включает
  # строку shared objects (datid=0) и template-базы, которые per-db запрос отбрасывает
  - query_name: q_checksum_failures
    query: |
      SELECT
        COALESCE(SUM(checksum_failures), 0)::float8 AS v
      FROM pg_stat_database

  - query_name: q_locks
    query: |
      SELECT
        mode,
        granted::text    AS granted,
        COUNT(*)::float8 AS cnt
      FROM pg_locks
      GROUP BY mode, granted

  # ops и time НЕ слиты: разные группировки (ops по backend_type+context, time по
  # backend_type) — общий результат дал бы time-метрике дубли строк по context
  - query_name: q_stat_io_ops
    query: |
      SELECT
        backend_type,
        context,
        COALESCE(SUM(reads), 0)::float8     AS reads,
        COALESCE(SUM(writes), 0)::float8    AS writes,
        COALESCE(SUM(extends), 0)::float8   AS extends,
        COALESCE(SUM(hits), 0)::float8      AS hits,
        COALESCE(SUM(evictions), 0)::float8 AS evictions,
        COALESCE(SUM(fsyncs), 0)::float8    AS fsyncs
      FROM pg_stat_io
      GROUP BY backend_type, context
      HAVING COALESCE(SUM(reads), 0) + COALESCE(SUM(writes), 0) + COALESCE(SUM(extends), 0)
           + COALESCE(SUM(hits), 0) + COALESCE(SUM(evictions), 0) + COALESCE(SUM(fsyncs), 0) > 0

  - query_name: q_stat_io_time
    query: |
      SELECT
        backend_type,
        COALESCE(SUM(read_time), 0)::float8  AS read,
        COALESCE(SUM(write_time), 0)::float8 AS write,
        COALESCE(SUM(fsync_time), 0)::float8 AS fsync
      FROM pg_stat_io
      GROUP BY backend_type
      HAVING COALESCE(SUM(read_time), 0) + COALESCE(SUM(write_time), 0) + COALESCE(SUM(fsync_time), 0) > 0

  - query_name: q_slru
    query: |
      SELECT
        name,
        blks_zeroed::float8  AS zeroed,
        blks_hit::float8     AS hit,
        blks_read::float8    AS read,
        blks_written::float8 AS written
      FROM pg_stat_slru

  # с q_wal_time НЕ слито: значение value_label = ИМЯ колонки, а обеим метрикам
  # нужны колонки write/sync с разными данными (счётчик vs мс); для lag-пары
  # репликации та же коллизия обойдена длинной формой (q_replication_lag)
  - query_name: q_wal_counters
    query: |
      SELECT
        wal_records::float8      AS records,
        wal_fpi::float8          AS fpi,
        wal_bytes::float8        AS bytes,
        wal_buffers_full::float8 AS buffers_full,
        wal_write::float8        AS write,
        wal_sync::float8         AS sync
      FROM pg_stat_wal

  - query_name: q_wal_time
    query: |
      SELECT
        wal_write_time::float8 AS write,
        wal_sync_time::float8  AS sync
      FROM pg_stat_wal

  - query_name: q_checkpointer
    query: |
      SELECT
        num_timed::float8       AS num_timed,
        num_requested::float8   AS num_requested,
        buffers_written::float8 AS buffers_written,
        write_time::float8      AS write,
        sync_time::float8       AS sync
      FROM pg_stat_checkpointer

  - query_name: q_bgwriter
    query: |
      SELECT
        buffers_clean::float8    AS buffers_clean,
        buffers_alloc::float8    AS buffers_alloc,
        maxwritten_clean::float8 AS maxwritten_clean
      FROM pg_stat_bgwriter

  - query_name: q_archiver
    query: |
      SELECT
        archived_count::float8 AS archived_count,
        failed_count::float8   AS failed_count
      FROM pg_stat_archiver

  # лаги репликации: байты и секунды из ОДНОГО чтения pg_stat_replication.
  # Длинная форма (stage — колонка данных, метрики берут его как key_label)
  # обходит коллизию value_label. У stage='sent' секундной пары в
  # pg_stat_replication не существует — lag_seconds там NULL: sql_exporter
  # пропускает такой сэмпл (проверено экспериментом; серия stage="sent" у
  # seconds не появляется), но пишет WARN "Value column is NULL" на каждый
  # scrape primary — осознанная цена слияния.
  # state <> 'backup' + MAX/GROUP BY: pg_basebackup держит ВТОРОЙ walsender с тем
  # же application_name (state='backup') — дубль лейблов ронял весь scrape ровно
  # в момент пересоздания реплики; MAX по имени = худший лаг из одноимённых
  - query_name: q_replication_lag
    query: |
      WITH src AS (
        SELECT
          CASE
            WHEN pg_is_in_recovery() THEN pg_last_wal_replay_lsn()
            ELSE pg_current_wal_lsn()
          END AS lsn
      )
      SELECT
        r.application_name,
        v.stage,
        MAX(v.lag_bytes)::float8   AS lag_bytes,
        MAX(v.lag_seconds)::float8 AS lag_seconds
      FROM pg_stat_replication r
      CROSS JOIN src
      CROSS JOIN LATERAL (
        VALUES
          ('sent',   COALESCE(pg_wal_lsn_diff(src.lsn, r.sent_lsn), 0),   NULL::float8),
          ('write',  COALESCE(pg_wal_lsn_diff(src.lsn, r.write_lsn), 0),  COALESCE(EXTRACT(EPOCH FROM r.write_lag), 0)::float8),
          ('flush',  COALESCE(pg_wal_lsn_diff(src.lsn, r.flush_lsn), 0),  COALESCE(EXTRACT(EPOCH FROM r.flush_lag), 0)::float8),
          ('replay', COALESCE(pg_wal_lsn_diff(src.lsn, r.replay_lsn), 0), COALESCE(EXTRACT(EPOCH FROM r.replay_lag), 0)::float8)
      ) AS v(stage, lag_bytes, lag_seconds)
      WHERE r.state <> 'backup'
      GROUP BY r.application_name, v.stage

  - query_name: q_sync_standbys
    query: |
      SELECT
        COUNT(*)::float8 AS cnt
      FROM pg_stat_replication
      WHERE sync_state = 'sync'

  - query_name: q_replication_slots
    query: |
      WITH src AS (
        SELECT
          CASE
            WHEN pg_is_in_recovery() THEN pg_last_wal_replay_lsn()
            ELSE pg_current_wal_lsn()
          END AS lsn
      )
      SELECT
        s.slot_name,
        COALESCE(s.wal_status, 'unknown')                            AS wal_status,
        s.active::int::float8                                        AS active,
        COALESCE(pg_wal_lsn_diff(src.lsn, s.restart_lsn), 0)::float8 AS retained_wal_bytes,
        COALESCE(s.safe_wal_size, -1)::float8                        AS safe_wal_size,
        1::float8                                                    AS info
      FROM pg_replication_slots s
      CROSS JOIN src

  - query_name: q_prepared_xacts
    query: |
      SELECT
        COUNT(*)::float8 AS count,
        COALESCE(EXTRACT(EPOCH FROM MAX(now() - prepared)), 0)::float8 AS oldest_seconds
      FROM pg_prepared_xacts

metrics:
  - metric_name: pg_up
    type: gauge
    help: "Whether the exporter can reach the database"
    values: [up]
    query_ref: q_up_uptime

  - metric_name: pg_postmaster_uptime_seconds
    type: gauge
    help: "Seconds since postmaster start (system/version_uptime.sql); drop = restart/crash/failover"
    values: [uptime_seconds]
    query_ref: q_up_uptime

  - metric_name: pg_stat_activity_count
    type: gauge
    help: "Sessions by state"
    key_labels: [state]
    values: [cnt]
    query_ref: q_activity_by_state

  - metric_name: pg_settings_max_connections
    type: gauge
    help: "max_connections setting"
    values: [max_connections]
    query_ref: q_settings

  # НЕ заменять на sum(pg_backends_by_user): та обрезана LIMIT 20 —
  # процент от лимита никогда не считают из top-N метрики
  - metric_name: pg_client_backends_count
    type: gauge
    help: "Client backends only, the ones that consume max_connections slots"
    values: [client_backends]
    query_ref: q_activity_scalars

  # кто именно занял слоты max_connections: клиентские бэкенды по базе/роли
  - metric_name: pg_backends_by_user
    type: gauge
    help: "Client backends by database and role: who is eating max_connections slots"
    key_labels: [datname, usename]
    values: [cnt]
    query_ref: q_backends_by_user

  - metric_name: pg_settings_autovacuum_max_workers
    type: gauge
    help: "autovacuum_max_workers setting (saturation line for worker panel)"
    values: [autovacuum_max_workers]
    query_ref: q_settings

  # --- семейство pg_stat_database: все 9 метрик из одного запроса (q_stat_database) ---
  - metric_name: pg_stat_database_xact_commit
    type: counter
    help: "Committed transactions per database"
    key_labels: [datname]
    values: [xact_commit]
    query_ref: q_stat_database

  - metric_name: pg_stat_database_xact_rollback
    type: counter
    help: "Rolled back transactions per database"
    key_labels: [datname]
    values: [xact_rollback]
    query_ref: q_stat_database

  - metric_name: pg_stat_database_blks_hit
    type: counter
    help: "Buffer cache hits per database"
    key_labels: [datname]
    values: [blks_hit]
    query_ref: q_stat_database

  - metric_name: pg_stat_database_blks_read
    type: counter
    help: "Disk block reads per database"
    key_labels: [datname]
    values: [blks_read]
    query_ref: q_stat_database

  - metric_name: pg_stat_database_deadlocks
    type: counter
    help: "Deadlocks per database"
    key_labels: [datname]
    values: [deadlocks]
    query_ref: q_stat_database

  # temp-файлы: и байты, и количество (cache_io/temp_files_by_database.sql)
  - metric_name: pg_stat_database_temp
    type: counter
    help: "Temp files spilled per database (cache_io/temp_files_by_database.sql)"
    key_labels: [datname]
    value_label: kind
    values: [bytes, files]
    query_ref: q_stat_database

  # время IO по базам, мс (требует track_io_timing=on; system/database_stats.sql)
  - metric_name: pg_stat_database_blk_time_ms
    type: counter
    help: "Block IO time per database, ms (needs track_io_timing)"
    key_labels: [datname]
    value_label: op
    values: [read, write]
    query_ref: q_stat_database

  # профиль строк по базам (system/database_stats.sql)
  - metric_name: pg_stat_database_tup
    type: counter
    help: "Tuple throughput per database (system/database_stats.sql)"
    key_labels: [datname]
    value_label: op
    values: [returned, fetched, inserted, updated, deleted]
    query_ref: q_stat_database

  # обрывы/фаталы/килы сессий (PG14+, system/sessions_stats.sql)
  - metric_name: pg_stat_database_sessions
    type: counter
    help: "Session terminations per database (system/sessions_stats.sql, PG14+)"
    key_labels: [datname]
    value_label: kind
    values: [total, abandoned, fatal, killed]
    query_ref: q_stat_database

  # повреждения страниц (PG12+, system/checksum_failures.sql); 0 = чисто или checksums off
  - metric_name: pg_checksum_failures_total
    type: counter
    help: "Checksum failures across cluster (system/checksum_failures.sql)"
    values: [v]
    query_ref: q_checksum_failures

  # granted=false — очередь за локами: её рост виден раньше и понятнее, чем сумма
  # удержанных+ожидающих; кто кого держит — таблица pg_blocking_pids в дашборде
  - metric_name: pg_locks_count
    type: gauge
    help: "Locks by mode and granted flag; granted=false = waiting queue (locks/blocking_sessions.sql family)"
    key_labels: [mode, granted]
    values: [cnt]
    query_ref: q_locks

  # --- атрибуция IO по подсистемам: кто именно ест диск (cache_io/stat_io_overview.sql, PG16+) ---
  - metric_name: pg_stat_io_ops_total
    type: counter
    help: "IO operations by backend_type and context (cache_io/stat_io_overview.sql, PG16+)"
    key_labels: [backend_type, context]
    value_label: op
    values: [reads, writes, extends, hits, evictions, fsyncs]
    query_ref: q_stat_io_ops

  - metric_name: pg_stat_io_time_ms_total
    type: counter
    help: "IO time by backend_type, ms (needs track_io_timing; PG16+)"
    key_labels: [backend_type]
    value_label: op
    values: [read, write, fsync]
    query_ref: q_stat_io_time

  # --- SLRU-кэши (PG13+, cache_io/slru_stats.sql): SubtransSLRU/MultiXact —
  #     классика внезапной деградации, в AAS видна лишь как безликий LWLock ---
  - metric_name: pg_slru_blks_total
    type: counter
    help: "SLRU cache activity by cache name (cache_io/slru_stats.sql, PG13+)"
    key_labels: [name]
    value_label: op
    values: [zeroed, hit, read, written]
    query_ref: q_slru

  # --- генерация WAL (wal/wal_activity.sql, PG14-17; на PG18 переехало в pg_stat_io) ---
  - metric_name: pg_stat_wal
    type: counter
    help: "WAL generation counters (wal/wal_activity.sql)"
    value_label: kind
    values: [records, fpi, bytes, buffers_full, write, sync]
    query_ref: q_wal_counters

  # латентность записи/fsync WAL (требует track_wal_io_timing=on) — главный
  # драйвер commit latency; time/count = мс на операцию (панель «WAL Latency»)
  - metric_name: pg_stat_wal_time_ms_total
    type: counter
    help: "WAL write/fsync time, ms (needs track_wal_io_timing; PG14-17, on PG18 moved to pg_stat_io)"
    value_label: op
    values: [write, sync]
    query_ref: q_wal_time

  # pg_wal_directory_size_bytes переехал в pg_instance_slow.yml:
  # pg_ls_waldir() сканирует каталог — не для 15s (fixes.txt ИНТЕРВАЛЫ)

  # --- чекпоинты и bgwriter: по одному запросу на вью (q_checkpointer, q_bgwriter) ---
  - metric_name: pg_stat_checkpointer_num_timed_total
    type: counter
    help: "Timed checkpoints, incl. skipped (wal/checkpoints_pg17.sql)"
    values: [num_timed]
    query_ref: q_checkpointer

  - metric_name: pg_stat_checkpointer_num_requested_total
    type: counter
    help: "Requested checkpoints (wal/checkpoints_pg17.sql)"
    values: [num_requested]
    query_ref: q_checkpointer

  - metric_name: pg_stat_checkpointer_buffers_written_total
    type: counter
    help: "Buffers written by checkpointer"
    values: [buffers_written]
    query_ref: q_checkpointer

  - metric_name: pg_stat_checkpointer_time_ms_total
    type: counter
    help: "Checkpoint write/sync time, ms (wal/checkpoints_pg17.sql)"
    value_label: op
    values: [write, sync]
    query_ref: q_checkpointer

  - metric_name: pg_stat_bgwriter_buffers_clean_total
    type: counter
    help: "Buffers cleaned by bgwriter (wal/bgwriter.sql)"
    values: [buffers_clean]
    query_ref: q_bgwriter

  - metric_name: pg_stat_bgwriter_buffers_alloc_total
    type: counter
    help: "Buffers allocated (wal/bgwriter.sql)"
    values: [buffers_alloc]
    query_ref: q_bgwriter

  - metric_name: pg_stat_bgwriter_maxwritten_clean_total
    type: counter
    help: "Times bgwriter stopped at bgwriter_lru_maxpages (wal/bgwriter.sql)"
    values: [maxwritten_clean]
    query_ref: q_bgwriter

  - metric_name: pg_stat_archiver_archived_count
    type: counter
    help: "Successfully archived WAL files (wal/archiver_status.sql)"
    values: [archived_count]
    query_ref: q_archiver

  - metric_name: pg_stat_archiver_failed_count
    type: counter
    help: "Failed WAL archive attempts (wal/archiver_status.sql)"
    values: [failed_count]
    query_ref: q_archiver

  - metric_name: pg_long_running_transactions
    type: gauge
    help: "Client transactions open longer than 5 minutes (activity/long_running_queries.sql)"
    values: [long_running]
    query_ref: q_activity_scalars

  # --- репликация со стороны primary (replication/replication_status.sql, replication_slots.sql) ---
  # обе lag-метрики — из q_replication_lag (длинная форма); серии на выходе те же:
  # stage теперь key_label из данных, а не value_label из имён колонок
  - metric_name: pg_stat_replication_lag_bytes
    type: gauge
    help: "Replica lag in bytes by stage vs current WAL, worst per application_name (replication/replication_status.sql)"
    key_labels: [application_name, stage]
    values: [lag_bytes]
    query_ref: q_replication_lag

  - metric_name: pg_stat_replication_lag_seconds
    type: gauge
    help: "Replica lag in seconds by stage, worst per application_name (write_lag/flush_lag/replay_lag)"
    key_labels: [application_name, stage]
    values: [lag_seconds]
    query_ref: q_replication_lag

  - metric_name: pg_sync_standbys
    type: gauge
    help: "Connected standbys in sync state; 0 while synchronous_standby_names set = commits are stuck"
    values: [cnt]
    query_ref: q_sync_standbys

  # --- слоты: обе метрики из одного запроса (q_replication_slots) ---
  - metric_name: pg_replication_slots
    type: gauge
    help: "Physical/logical slots: active flag, retained WAL bytes, safe_wal_size (-1 = unlimited)"
    key_labels: [slot_name]
    value_label: kind
    values: [active, retained_wal_bytes, safe_wal_size]
    query_ref: q_replication_slots

  # wal_status = 'lost'/'unreserved' информативнее байтов удержания (PG13+)
  - metric_name: pg_replication_slot_status
    type: gauge
    help: "Slot wal_status as info metric: reserved/extended/unreserved/lost; value always 1"
    key_labels: [slot_name, wal_status]
    values: [info]
    query_ref: q_replication_slots

  # --- гигиена инстанса ---
  - metric_name: pg_prepared_xacts
    type: gauge
    help: "Prepared (2PC) transactions: count and oldest age (activity/prepared_transactions.sql)"
    value_label: kind
    values: [count, oldest_seconds]
    query_ref: q_prepared_xacts

  - metric_name: pg_settings_pending_restart
    type: gauge
    help: "Settings changed but waiting for restart (system/pending_restart.sql)"
    values: [pending_restart]
    query_ref: q_settings
