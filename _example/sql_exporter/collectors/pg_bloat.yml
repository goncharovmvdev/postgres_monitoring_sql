# оценка bloat (fixes.txt MEDIUM): dead tuples != bloat — вакуум обнуляет
# счётчик, место не возвращает. Запрос тяжёлый (полный проход по статистике):
# min_interval 1h обязателен, на частотах 15s-5m ставить НЕЛЬЗЯ.
# Адаптация tables/table_bloat_estimate.sql, top-20 по потерянным байтам
# Источник статистики — monitoring_column_stats (init/01_monitoring.sql), а не
# pg_stats: узкая вью отдаёт только null_frac/avg_width и позволяет обойтись
# БЕЗ pg_read_all_data (роль не может читать данные таблиц). Вью нужна в
# каждой базе, с которой собирается bloat.
collector_name: pg_bloat
min_interval: 1h

queries:
  - query_name: q_table_bloat
    query: |
      WITH constants AS (
          SELECT
            current_setting('block_size')::NUMERIC AS bs,
            23 AS hdr,
            8  AS ma
      ),
      column_stats AS (
          SELECT
            s.schemaname,
            s.tablename,
            c.bs,
            c.hdr,
            c.ma,
            SUM((1 - s.null_frac) * s.avg_width) AS datawidth,
            MAX(s.null_frac)                     AS maxfracsum,
            c.hdr + 1 + (
              SELECT
                COUNT(*)
              FROM monitoring_column_stats s2
              WHERE s2.schemaname = s.schemaname
                AND s2.tablename = s.tablename
                AND s2.null_frac <> 0
            ) / 8 AS nullhdr
          FROM monitoring_column_stats s
          CROSS JOIN constants c
          WHERE s.schemaname NOT IN ('pg_catalog', 'information_schema')
          GROUP BY s.schemaname, s.tablename, c.bs, c.hdr, c.ma
      ),
      row_width AS (
          SELECT
            schemaname,
            tablename,
            bs,
            ma,
            (datawidth + (hdr + ma - CASE WHEN hdr % ma = 0 THEN ma ELSE hdr % ma END))::NUMERIC AS datahdr,
            maxfracsum * (nullhdr + ma - CASE WHEN nullhdr % ma = 0 THEN ma ELSE nullhdr % ma END) AS nullhdr2
          FROM column_stats
      ),
      expected AS (
          SELECT
            rw.schemaname,
            rw.tablename,
            rw.bs,
            cc.relpages,
            CEIL(
                     cc.reltuples * (
                         rw.datahdr + rw.ma
                         - CASE WHEN rw.datahdr % rw.ma = 0 THEN rw.ma ELSE rw.datahdr % rw.ma END
                         + rw.nullhdr2 + 4
                     ) / (rw.bs - 20)
                 ) AS expected_pages
          FROM row_width rw
          JOIN pg_namespace nn ON nn.nspname = rw.schemaname
          JOIN pg_class cc ON cc.relname = rw.tablename
                          AND cc.relnamespace = nn.oid
          WHERE cc.relkind = 'r' AND cc.relpages > 0
      )
      SELECT
        current_database() AS datname,
        schemaname,
        tablename          AS relname,
        (bs * GREATEST(relpages - expected_pages, 0))::float8 AS wasted_bytes,
        COALESCE(100.0 * GREATEST(relpages - expected_pages, 0)
                 / NULLIF(relpages, 0), 0)::float8 AS wasted_pct
      FROM expected
      ORDER BY bs * GREATEST(relpages - expected_pages, 0) DESC
      LIMIT 20

  - query_name: q_index_bloat
    query: |
      WITH index_base AS (
          SELECT
            ci.relname AS idxname,
            ci.reltuples,
            ci.relpages,
            i.indrelid   AS tbloid,
            i.indexrelid AS idxoid,
            i.indnatts,
            COALESCE(SUBSTRING(ARRAY_TO_STRING(ci.reloptions, ' ')
                     FROM 'fillfactor=([0-9]+)')::SMALLINT, 90) AS fillfactor,
            STRING_TO_ARRAY(i.indkey::TEXT, ' ')::INT[] AS indkey
          FROM pg_index i
          JOIN pg_class ci ON ci.oid = i.indexrelid
          WHERE ci.relam = (SELECT oid FROM pg_am WHERE amname = 'btree')
            AND ci.relpages > 0
            AND ci.reltuples >= 0
      ),
      index_attrs AS (
          SELECT
            b.*,
            pos.attpos
          FROM index_base b
          CROSS JOIN LATERAL GENERATE_SERIES(1, b.indnatts) AS pos(attpos)
      ),
      index_cols AS (
          SELECT
            ct.relnamespace,
            ct.relname AS tblname,
            ia.idxname,
            ia.reltuples,
            ia.relpages,
            ia.idxoid,
            ia.fillfactor,
            COALESCE(a1.attname, a2.attname)   AS attname,
            COALESCE(a1.atttypid, a2.atttypid) AS atttypid,
            CASE WHEN a1.attnum IS NULL THEN ia.idxname ELSE ct.relname END AS attrelname
          FROM index_attrs ia
          JOIN pg_class ct ON ct.oid = ia.tbloid
          LEFT JOIN pg_attribute a1
              ON ia.indkey[ia.attpos] <> 0
             AND a1.attrelid = ia.tbloid AND a1.attnum = ia.indkey[ia.attpos]
          LEFT JOIN pg_attribute a2
              ON ia.indkey[ia.attpos] = 0
             AND a2.attrelid = ia.idxoid AND a2.attnum = ia.attpos
      ),
      index_stats AS (
          SELECT
            n.nspname,
            ic.tblname,
            ic.idxname,
            ic.reltuples,
            ic.relpages,
            ic.fillfactor,
            current_setting('block_size')::NUMERIC AS bs,
            8  AS maxalign,
            24 AS pagehdr,
            16 AS pageopqdata,
            CASE WHEN MAX(COALESCE(s.null_frac, 0)) = 0 THEN 8
                 ELSE 8 + (32 + 8 - 1) / 8 END AS index_tuple_hdr_bm,
            SUM((1 - COALESCE(s.null_frac, 0)) * COALESCE(s.avg_width, 1024)) AS nulldatawidth
          FROM index_cols ic
          JOIN pg_namespace n ON n.oid = ic.relnamespace
          JOIN monitoring_column_stats s ON s.schemaname = n.nspname
                         AND s.tablename = ic.attrelname
                         AND s.attname = ic.attname
                         AND NOT s.inherited
          WHERE n.nspname NOT IN ('pg_catalog', 'information_schema', 'pg_toast')
          GROUP BY n.nspname, ic.tblname, ic.idxname, ic.reltuples, ic.relpages, ic.fillfactor
      ),
      index_width AS (
          SELECT
            nspname,
            tblname,
            idxname,
            reltuples,
            relpages,
            fillfactor,
            bs,
            pagehdr,
            pageopqdata,
            (index_tuple_hdr_bm + maxalign
                  - CASE WHEN index_tuple_hdr_bm % maxalign = 0 THEN maxalign
                         ELSE index_tuple_hdr_bm % maxalign END
                  + nulldatawidth + maxalign
                  - CASE WHEN nulldatawidth = 0 THEN 0
                         WHEN nulldatawidth::INTEGER % maxalign = 0 THEN maxalign
                         ELSE nulldatawidth::INTEGER % maxalign END
                 )::NUMERIC AS nulldatahdrwidth
          FROM index_stats
      ),
      index_expected AS (
          SELECT
            nspname,
            tblname,
            idxname,
            relpages,
            bs,
            COALESCE(1 + CEIL(reltuples::NUMERIC / NULLIF(
                FLOOR((bs - pageopqdata - pagehdr) * fillfactor
                      / (100 * (4 + nulldatahdrwidth))), 0)), 0) AS est_pages_ff
          FROM index_width
      )
      SELECT
        current_database() AS datname,
        nspname            AS schemaname,
        tblname            AS relname,
        idxname            AS indexrelname,
        (bs * GREATEST(relpages - est_pages_ff, 0))::float8 AS wasted_bytes,
        COALESCE(100.0 * GREATEST(relpages - est_pages_ff, 0)
                 / NULLIF(relpages, 0), 0)::float8 AS wasted_pct
      FROM index_expected
      ORDER BY bs * GREATEST(relpages - est_pages_ff, 0) DESC
      LIMIT 20

metrics:
  - metric_name: pg_table_bloat
    type: gauge
    help: "Estimated table bloat: wasted bytes and percent (tables/table_bloat_estimate.sql)"
    key_labels: [datname, schemaname, relname]
    value_label: kind
    values: [wasted_bytes, wasted_pct]
    query_ref: q_table_bloat

  # bloat btree-индексов — REINDEX CONCURRENTLY-кандидаты; vacuum индексы не сжимает.
  # Адаптация indexes/index_bloat_estimate.sql, top-20 по потерянным байтам
  - metric_name: pg_index_bloat
    type: gauge
    help: "Estimated btree index bloat: wasted bytes and percent (indexes/index_bloat_estimate.sql)"
    key_labels: [datname, schemaname, relname, indexrelname]
    value_label: kind
    values: [wasted_bytes, wasted_pct]
    query_ref: q_index_bloat
