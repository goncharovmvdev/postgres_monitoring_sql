# размеры и гигиена (fixes.txt ИНТЕРВАЛЫ: 300s):
# pg_database_size/pg_total_relation_size обходят файлы и берут AccessShareLock —
# на 15s это и лишняя нагрузка, и риск встать за DDL (см. таймауты роли monitoring)
collector_name: pg_objects_slow
min_interval: 300s

queries:
  - query_name: q_db_sizes
    query: |
      SELECT
        datname,
        pg_database_size(oid)::float8 AS size_bytes
      FROM pg_database
      WHERE NOT datistemplate

  # datname+schemaname обязательны — см. комментарий про коллизии relname
  # в шапке pg_objects.yml
  - query_name: q_table_sizes
    query: |
      SELECT
        current_database()                                           AS datname,
        n.nspname                                                    AS schemaname,
        c.relname,
        pg_total_relation_size(c.oid)::float8                        AS total,
        pg_indexes_size(c.oid)::float8                               AS index,
        COALESCE(pg_total_relation_size(c.reltoastrelid), 0)::float8 AS toast
      FROM pg_class c
      JOIN pg_namespace n ON n.oid = c.relnamespace
      WHERE c.relkind = 'r' AND n.nspname NOT IN ('pg_catalog', 'information_schema')
      ORDER BY pg_total_relation_size(c.oid) DESC
      LIMIT 20

  # «есть ли проблемные индексы» — мёртвый груз (unused: цена на каждой записи)
  # и сломанные после CREATE INDEX CONCURRENTLY (invalid) одним запросом
  - query_name: q_index_hygiene
    query: |
      SELECT
        current_database() AS datname,
        u.count,
        u.bytes,
        i.cnt
      FROM (
        SELECT
          COUNT(*)::float8                                         AS count,
          COALESCE(SUM(pg_relation_size(s.indexrelid)), 0)::float8 AS bytes
        FROM pg_stat_user_indexes s
        JOIN pg_index i ON i.indexrelid = s.indexrelid
        WHERE s.idx_scan = 0 AND NOT i.indisunique AND NOT i.indisprimary
      ) u
      CROSS JOIN (
        SELECT
          COUNT(*)::float8 AS cnt
        FROM pg_index
        WHERE NOT indisvalid
      ) i

  # ТРЕБУЕТ грантов: pg_sequences.last_value = NULL без SELECT/USAGE на sequence
  # (см. init/01_monitoring.sql); NULL здесь = sequence ещё не использовалась (0%).
  # Формула считает израсходованную долю ДИАПАЗОНА В НАПРАВЛЕНИИ increment:
  # last_value/max_value неверно для убывающих sequence (increment < 0),
  # нестандартного min_value и отрицательных значений. ::numeric обязателен —
  # max_value - min_value у bigint-sequence переполняет bigint.
  # cycle в лейбле: у CYCLE-sequence исчерпания не бывает (она заворачивается,
  # риск другой — конфликт уникальности), панель исчерпания их исключает.
  # top-5 С ИМЕНЕМ: безымянный "worst %" не actionable
  - query_name: q_sequences
    query: |
      (
        SELECT
          current_database() AS datname,
          schemaname,
          sequencename       AS seqname,
          cycle::text        AS cycle,
          CASE
            WHEN last_value IS NULL THEN 0
            WHEN increment_by > 0 THEN 100.0 * (last_value::numeric - min_value::numeric)
                                        / NULLIF(max_value::numeric - min_value::numeric, 0)
            ELSE 100.0 * (max_value::numeric - last_value::numeric)
                       / NULLIF(max_value::numeric - min_value::numeric, 0)
          END::float8 AS pct
        FROM pg_sequences
        ORDER BY pct DESC
        LIMIT 5
      )
      UNION ALL
      SELECT current_database(), '(none)', '(none)', 'false', 0::float8
      WHERE NOT EXISTS (SELECT 1 FROM pg_sequences)

metrics:
  - metric_name: pg_db_size_bytes
    type: gauge
    help: "Database size in bytes (databases/database_sizes.sql)"
    key_labels: [datname]
    values: [size_bytes]
    query_ref: q_db_sizes

  # --- per-table: размер (tables/table_sizes.sql) ---
  - metric_name: pg_table_size_bytes
    type: gauge
    help: "Top-20 tables by size, split by part (tables/table_sizes.sql)"
    key_labels: [datname, schemaname, relname]
    value_label: part
    values: [total, index, toast]
    query_ref: q_table_sizes

  # --- индексная гигиена (indexes/unused_indexes.sql, invalid_indexes.sql) ---
  - metric_name: pg_unused_indexes
    type: gauge
    help: "Indexes with zero scans, excl. PK/unique (indexes/unused_indexes.sql)"
    key_labels: [datname]
    value_label: kind
    values: [count, bytes]
    query_ref: q_index_hygiene

  - metric_name: pg_invalid_indexes
    type: gauge
    help: "Invalid indexes count (indexes/invalid_indexes.sql)"
    key_labels: [datname]
    values: [cnt]
    query_ref: q_index_hygiene

  # --- исчерпание sequences (tables/sequence_exhaustion.sql) ---
  - metric_name: pg_sequence_used_pct
    type: gauge
    help: "Top-5 sequences by consumed share of their range in the increment direction (handles descending/min_value/negative increment); cycle=true cannot be exhausted; needs SELECT on sequences"
    key_labels: [datname, schemaname, seqname, cycle]
    values: [pct]
    query_ref: q_sequences
