collector_name: pg_instance_slow
min_interval: 60s

# «жив ли архиватор» — глубина очереди .ready и давность последнего успеха:
# два симптома одного отказа (failed_count==0 при висящем архиваторе — ложный
# покой). pg_wal_directory_size отдельно: «сколько диска ест WAL» — другой
# вопрос (маршрут «место кончается»), и второй каталог-скан в том же
# statement — лишний риск под общий statement_timeout
queries:
  # каталог-скан pg_wal — не для 15s, поэтому коллектор на min_interval 60s
  - query_name: q_wal_dir_size
    query: |
      SELECT
        COALESCE(SUM(size), 0)::float8 AS v
      FROM pg_ls_waldir()

  - query_name: q_archiver_queue
    query: |
      SELECT
        (
          SELECT
            COUNT(*)
          FROM pg_ls_archive_statusdir()
          WHERE name LIKE '%.ready'
        )::float8 AS pending,
        (
          SELECT
            COALESCE(EXTRACT(EPOCH FROM (now() - last_archived_time)), -1)
          FROM pg_stat_archiver
        )::float8 AS last_age

  # «конфиг тихо не применился» (security/hba_file_errors.sql,
  # system/config_file_errors.sql): битая строка pg_hba/postgresql.conf НЕ
  # роняет сервер — он молча продолжает жить со СТАРЫМИ правилами до рестарта,
  # который уже не поднимется. pending_restart — другой сигнал (валидно, но ждёт
  # рестарта), поэтому 'setting could not be applied' здесь исключён.
  # Обе вью читаются ролью monitoring через pg_monitor -> pg_read_all_settings
  - query_name: q_config_file_errors
    query: |
      SELECT
        (
          SELECT
            COUNT(*)
          FROM pg_hba_file_rules
          WHERE error IS NOT NULL
        )::float8 AS hba,
        (
          SELECT
            COUNT(*)
          FROM pg_file_settings
          WHERE error IS NOT NULL
            AND error <> 'setting could not be applied'
        )::float8 AS config

metrics:
  - metric_name: pg_wal_directory_size_bytes
    type: gauge
    help: "pg_wal directory size (wal/wal_directory_size.sql); directory scan, keep at 60s+"
    values: [v]
    query_ref: q_wal_dir_size

  - metric_name: pg_archiver_pending_wals
    type: gauge
    help: "WAL segments waiting to be archived (.ready files in archive_status)"
    values: [pending]
    query_ref: q_archiver_queue

  # -1 = ещё ничего не архивировалось (или standby без archive_mode=always)
  - metric_name: pg_archiver_last_archived_age_seconds
    type: gauge
    help: "Seconds since last successful WAL archive; -1 = never"
    values: [last_age]
    query_ref: q_archiver_queue

  # >0 = правка конфига ТИХО не применилась; строки с ошибками — в самих вью
  # (security/hba_file_errors.sql, system/config_file_errors.sql)
  - metric_name: pg_config_file_errors
    type: gauge
    help: "Broken lines in pg_hba.conf / postgresql.conf (kind=hba|config); server silently keeps OLD values, next restart will FAIL; restart-pending excluded (see pg_settings_pending_restart)"
    value_label: kind
    values: [hba, config]
    query_ref: q_config_file_errors
