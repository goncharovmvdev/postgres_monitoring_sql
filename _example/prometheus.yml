global:
  scrape_interval: 15s
  # мультихост/мультикластер (fixes.txt HIGH): различают кластеры при
  # remote_write/federation/алертах; в локальных запросах не видны
  external_labels:
    cluster: pg-demo
    env: dev

scrape_configs:
  - job_name: node          # слой 1 «ОС» (включая сигналы гипервизора: steal, PSI)
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: demo-host   # связывает node-метрики с PG-инстансом ($host в дашбордах)

  # Postgres-метрики: экспортёр один, но scrape РАЗВЕДЁН по НОДАМ через
  # params jobs[] (sql_exporter v0.14+). У каждой ноды свой scrape-таргет,
  # свой sample_limit и свой up{job=...}: превышение лимита или зависший сбор
  # одной ноды не гасит метрики другой одним отброшенным scrape'ом.
  # Имена — по НОДАМ (pg01/pg02), а не по ролям: роль живёт в метрике
  # pg_in_recovery и переезжает при failover без правки конфигов.
  # каждый scrape забирает ПАРУ job'ов sql_exporter: инстансовый (pgNN, DSN в
  # служебную postgres) и объектный (pgNN-appdb, DSN в прикладную базу) — обе
  # принадлежат одной ноде, sample_limit общий на scrape
  - job_name: sql-pg01
    params:
      jobs[]: [pg01, pg01-appdb]
    honor_labels: true      # сохранить лейблы job/instance, проставленные sql_exporter
    # предохранители кардинальности (fixes.txt КАРДИНАЛЬНОСТЬ): лучше потерять
    # один scrape, чем взорвать TSDB; лимит теперь per-инстанс (~3k факт)
    sample_limit: 8000
    label_limit: 30
    static_configs:
      - targets: ["sql-exporter:9399"]
        labels:
          host: demo-host

  - job_name: sql-pg02
    params:
      jobs[]: [pg02, pg02-appdb]
    honor_labels: true
    sample_limit: 8000
    label_limit: 30
    static_configs:
      - targets: ["sql-exporter:9399"]
        labels:
          host: demo-host

  # самомониторинг Prometheus: prometheus_tsdb_head_series для ряда
  # «Monitoring Health» в pg-layered (рост серий = взрыв кардинальности)
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
